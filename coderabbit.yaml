  # ── PER-PATH SPECIALIST INSTRUCTIONS ────────────────────────────────────
  path_instructions:

    - path: "og-ep-superintendent/core/fiber_sheaf_engine.py"
      instructions: |
        This is the PRIMARY MATHEMATICAL KERNEL. Every line is IP-sensitive.

        Verify these invariants on EVERY review:

        1. von_mangoldt(n):
           - Must use trial division up to √n (not just _PRIMES table)
           - Λ(p^k) = log(p) for all primes p, all k ≥ 1
           - Λ(n) = 0 if n has two or more distinct prime factors
           - Test: Λ(4)=log(2), Λ(9)=log(3), Λ(15)=0, Λ(131²)=log(131)

        2. rodrigues_rotation(u, v) → R ∈ SO(d):
           - R must be orthogonal: ‖RᵀR − I‖_F < 1e-10
           - det(R) must equal +1 (proper rotation, not reflection)
           - For anti-parallel (cos θ = −1): return π-rotation in plane(u, e)
             where e ⊥ u, NOT −I (which has det = (−1)^d, wrong for odd d)
           - R·û = v̂ must hold to machine precision

        3. restriction_map(s_u, s_v, c) = c · R(ŝ_u → ŝ_v):
           - ρᵀρ must equal c² · I (isotropy of parallel transport)
           - c must be clipped to [0, 1]

        4. FiberBundle.build():
           - Must build ρ[(u,v)] AND ρ[(v,u)] for every edge (u,v)
           - raw_sections must be padded/truncated to d, not passed as np.array
             when sections have ragged lengths

        5. FiberSheafOps.build_block_laplacian():
           - Edge list must be UNDIRECTED (no double-counting (u,v) and (v,u))
           - Diagonal: Σ_{u∼v} ρᵀρ — must equal c² · I per edge
           - Off-diagonal: −ρ_{uv}ᵀ ρ_{vu} — holonomy lives here
           - Result must be symmetric PSD

        6. ZetaSpectralEmbedder:
           - ZETA_ZEROS_T is IMMUTABLE. Never modify. Cite LMFDB if changed.
           - spectral_zeta_function: must use vectorised outer product, not loop
           - zeta_coherence: must normalise by ζ_L(½), not raw magnitude

        7. from_afe / from_well:
           - coherence_score accessed as @property (no parentheses)
           - Only undirected edges in edge list (FiberBundle.build handles reverse)
           - Prime weighting applied AFTER section normalisation

    - path: "og-ep-superintendent/core/wellbore_topology.py"
      instructions: |
        Laplacian correctness is critical here.
        _compute_laplacian must return L = D − A, NOT AᵀA.
        D = diag(row sums of adjacency matrix).
        AᵀA is not a Laplacian and its eigenvalues have no topological meaning.

        H³ keyword list must use word-boundary matching for short abbreviations.
        "sis" matches "analysis" — use r'\bsis\b' or " sis " padding.

        λ₁ thresholds must be consistent across classify_event and compute_delta.
        If LAMBDA_1_THRESHOLDS["weak"] = 0.001, then the gate must use 0.001
        everywhere, not mix 0.001 and 0.01.

    - path: "og-ep-superintendent/core/afe_laplacian.py"
      instructions: |
        _build_cost_graph returns the weighted adjacency matrix (delta).
        compute_cost_key must compute L = D − delta, not delta.T @ delta.
        The eigenvalues of delta.T @ delta are singular values squared —
        they encode matrix rank, not graph connectivity or spectral gap.

        coherence_score is a @property on AFELineItem.
        Access as li.coherence_score (no parentheses).

    - path: "og-ep-superintendent/core/topology_lite.py"
      instructions: |
        power_iteration_lambda1 must return the SECOND SMALLEST eigenvalue of L.
        Standard power iteration returns the LARGEST eigenvalue.

        Correct algorithm:
          1. lam_max = power_iter_forward(L)          (largest)
          2. B = lam_max·I − L                        (shift)
          3. lam_max_B = power_iter_forward(B)        (largest of B)
          4. λ₁ = lam_max − lam_max_B                (second smallest of L)

        The ShiftedOp pattern (B.matvec(v) = lam_max·v − L·v) avoids inversion.

        Open intervals after the first must all be connected to the chain.
        Do not leave n_open_intervals > 1 with only the first attached.

    - path: "og-ep-superintendent/core/compute_dispatch.py"
      instructions: |
        Tier cost estimates must stay accurate relative to the benchmark table
        in the module docstring. If benchmarks are re-run, update _COST dict.

        FAST tier must complete in < 2ms for n ≤ 17 (AFE size).
        Any change that adds operations to FAST tier needs benchmark justification.

        Translation table thresholds must match the master table:
          λ₁ ≥ 0.5   → COHERENT
          0.01–0.5    → CAUTION
          0.001–0.01  → WARN
          < 0.001     → HALT_A4

        BackgroundSheaf thread must be daemon=True to avoid blocking process exit.

    - path: "og-ep-superintendent/core/ddr_harvester.py"
      instructions: |
        delta_lambda_1 and k_s_snapshot are Optional fields.
        Every f-string that formats them must guard with `is not None`.
        Pattern: f"  Δλ₁={ddr.delta_lambda_1:+.4f}" only inside
                 `if ddr.delta_lambda_1 is not None:` block.

        save_ddr serialises via asdict(ddr). total_hours is a @property
        and will NOT appear in the JSON output. get_well_summary must
        recompute total_hours from the persisted hour fields, not read a key.

        harvest_shape_pair must only accept Δλ₁ ≥ 0.
        Any relaxation of this gate breaks the Wormhole-Path 2 invariant.

    - path: "og-ep-superintendent/evidence/**.jsonl"
      instructions: |
        Every line must be a valid JSON object parseable by json.loads().
        Trailing bare integers, empty lines, or partial records are BLOCKING.
        Validate with: python3 -c "import json; [json.loads(l) for l in open(f)]"

    - path: "og-ep-superintendent/evidence/**.json"
      instructions: |
        DDR evidence files: report_date in k_s_snapshot must match
        the filename date and the top-level report_date field.
        Drift between these three dates is a data-integrity violation.

    - path: ".github/workflows/**.yml"
      instructions: |
        The omega_crystal_gate topological-review job must:
        1. Parse JSON artifacts with python3 json module, not shell jq pipes
           that fail on multi-document files.
        2. Check ALL artifact files, not just ks_files[0].
        3. Read lambda1 (not lambda_1) consistently — check key name matches
           what the Python engine actually writes.
        4. The gate must fail the build on HALT_A4, not just print a message.

    - path: "og-ep-superintendent/data/well_program.py"
      instructions: |
        force=True bypass must still validate authorized_by is non-empty.
        An empty string authorizer makes the evidence record non-auditable.

        WellProgram factory / default constructor must set current_phase_index
        to a valid advancing state, not leave all phases PENDING with no
        mechanism to start the first one.

    - path: "og-ep-superintendent/full_demo.py"
      instructions: |
        Every DDR that is harvested for shape pairs must first be persisted
        to disk via DDRHarvester.save_ddr(). Harvesting from an un-saved DDR
        creates a shape pair with no corresponding evidence file — a
        traceability break (violates Axiom A7).

    - path: "og-ep-superintendent/run_demo_lite.py"
      instructions: |
        λ₁ threshold must be consistent: use LAMBDA_1_THRESHOLDS["weak"] = 0.001
        everywhere. Do not mix 0.001 (gate) and 0.01 (report colour) in the
        same execution path.

        Lite DDR output schema must include all fields required by
        DDRHarvester.get_well_summary() or the aggregation will KeyError.

    - path: "og-ep-superintendent/router/ops_bipartite_router.py"
      instructions: |
        lambda_1 from topology_basis may be the string "N/A" if K(S) hasn't
        been computed. Guard with isinstance(v, float) before f"{v:.4f}".

        AFE variance: decide once whether it's a fraction (0.12) or a
        percentage (12.0) and enforce that contract at every API boundary.
        Do not silently reinterpret units across the routing package.

    - path: "FIBER_SHEAF_ZETA_BRAINSTORM.md"
      instructions: |
        This is an IP strategy document. Do not suggest removing or weakening
        any of the 10 patent claims. Flag any claim that might conflict with
        prior art not yet cited. Check that mathematical terminology is precise.

  # [TOOLS:ast-grep] — structural semantic rules for math invariants
