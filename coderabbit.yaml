  # IDs: ZYP:MATH-001..004  ZYP:IP-001  ZYP:SAFE-001..002  ZYP:DATA-001
  # CLI override: set env CR_QUALITY_OVERRIDE=1 to skip WARN-only rules
  # Edit override: if ks_fiber_score > 0.70 AND no BLOCKING rules fire
  #                → auto-label quality:high, suggest approve
  tools:
    ast-grep:
      enabled: true
