name: Omega Crystal Gate (Phase 9 - Hardened)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  topological-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Prime Crystal dependencies
        run: |
          pip install scipy numpy

      - name: Download local K(S) evidence bundle (from local Dark Launch)
        uses: actions/download-artifact@v4
        with:
          name: omega-ks-fingerprint
          path: .omega-evidence/
        continue-on-error: true

      - name: Extract and inject K(S) into environment
        id: ks
        run: |
          if [ -f .omega-evidence/*.json ]; then
            KS_JSON=$(cat .omega-evidence/*.json | jq -c .)
            echo "ks_json=$KS_JSON" >> $GITHUB_OUTPUT
            echo "Local K(S) fingerprint loaded for cloud review."
          else
            echo "ks_json={\"error\":\"no_local_ks\"}" >> $GITHUB_OUTPUT
            echo "No local K(S) found — cloud review will proceed with reduced context."
          fi

      - name: CodeRabbit Pro Cloud Review (Sheaf Lens Enforcement)
        uses: coderabbitai/ai-pr-reviewer@v1
        with:
          # Pass the local topological baseline directly to CodeRabbit
          extra_context: |
            This PR was pre-validated by the local Prime Crystal Engine.
            You MUST evaluate every change against the following live K(S) baseline:
            ${{ steps.ks.outputs.ks_json }}

            Reject any diff that causes:
            - Δλ₁ < 0
            - Non-trivial holonomy
            - Increase in H² obstructions

            Only approve if the PR maintains or improves geometric coherence.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enforce Topological Coherence Gate
        run: |
          # In a real hardened pipeline, we would parse CodeRabbit output here
          # and fail the build if it reports negative Δλ₁ or new H² obstructions.
          echo "Cloud topological review completed. Check CodeRabbit comments for K(S) alignment."

      - name: Upload final evidence
        uses: actions/upload-artifact@v4
        with:
          name: omega-final-evidence
          path: evidence/
