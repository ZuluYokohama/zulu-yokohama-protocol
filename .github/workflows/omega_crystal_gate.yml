name: Omega Crystal Gate (Phase 9 - Hardened)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  topological-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Prime Crystal dependencies
        run: |
          pip install scipy numpy

      - name: Download local K(S) evidence bundle (from local Dark Launch)
        uses: actions/download-artifact@v4
        with:
          name: omega-ks-fingerprint
          path: .omega-evidence/
        continue-on-error: true

      - name: Extract and inject K(S) into environment
        id: ks
        run: |
          KS_JSON='{}'
          for f in .omega-evidence/*.json; do
            [ -f "$f" ] || continue
            KS_JSON=$(python3 -c "
import json; d=json.load(open('$f'))
if 'lambda1' in d and 'lambda_1' not in d: d['lambda_1']=d.pop('lambda1')
print(json.dumps(d))
")
          done
          echo "ks_json=$KS_JSON" >> $GITHUB_OUTPUT
          echo "K(S) extracted"

      - name: Topological Coherence Gate — local K(S) validation
        run: |
          python3 - <<'EOF'
          import json, sys, os, glob

          print("=== Omega Crystal Gate — Topological Coherence Check ===")
          ks_files = glob.glob(".omega-evidence/*.json")
          failures = []

          if ks_files:
              for ks_path in ks_files:
                  with open(ks_path) as f:
                      ks = json.load(f)
                  if 'lambda1' in ks and 'lambda_1' not in ks:
                      ks['lambda_1'] = ks.pop('lambda1')
                  lam = ks.get('lambda_1', None)
                  hol = ks.get('holonomy_signature', 'trivial')
                  h2  = int(ks.get('dimH2', ks.get('dim_H2', 0)))
                  print(f"  [{ks_path}]  lambda_1={lam}  holonomy={hol}  H2={h2}")
                  if lam is not None and float(lam) < 0:
                      failures.append(f"lambda_1={lam} < 0")
                  if hol and 'non-trivial' in str(hol):
                      failures.append(f"non-trivial holonomy: {hol}")
              if failures:
                  for msg in failures: print(f"  FAIL: {msg}")
                  sys.exit(1)
              print("  ✓ K(S) artifacts within coherence bounds")
          else:
              print("  No K(S) artifact — structural checks only.")

          required = [
              "og-ep-superintendent/core/afe_laplacian.py",
              "og-ep-superintendent/core/ddr_harvester.py",
              "og-ep-superintendent/core/topology_lite.py",
          ]
          missing = [r for r in required if not os.path.exists(r)]
          if missing:
              print(f"  FAIL: missing files: {missing}")
              sys.exit(1)
          print("  ✓ Required modules present")
          print("=== Gate PASSED ===")
          EOF

      - name: Upload final evidence
        uses: actions/upload-artifact@v4
        with:
          name: omega-final-evidence
          path: evidence/
