name: Omega Crystal Gate (Phase 9 - Hardened)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  topological-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Prime Crystal dependencies
        run: |
          pip install scipy numpy

      - name: Download local K(S) evidence bundle (from local Dark Launch)
        uses: actions/download-artifact@v4
        with:
          name: omega-ks-fingerprint
          path: .omega-evidence/
        continue-on-error: true

      - name: Extract and inject K(S) into environment
        id: ks
        run: |
          if compgen -G ".omega-evidence/*.json" > /dev/null 2>&1; then
            KS_JSON=$(cat .omega-evidence/*.json | python3 -c "import sys,json; data=[json.loads(l) for l in sys.stdin]; print(json.dumps(data[0] if len(data)==1 else data))")
            echo "ks_json=$KS_JSON" >> $GITHUB_OUTPUT
            echo "Local K(S) fingerprint loaded for cloud review."
          else
            echo "ks_json={\"error\":\"no_local_ks\"}" >> $GITHUB_OUTPUT
            echo "No local K(S) found — proceeding with structural-only gate."
          fi

      - name: Topological Coherence Gate — local K(S) validation
        run: |
          python3 - <<'EOF'
          import json, sys, os, glob

          print("=== Omega Crystal Gate — Topological Coherence Check ===")

          # Load K(S) baseline if present
          ks_files = glob.glob(".omega-evidence/*.json")
          if ks_files:
              with open(ks_files[0]) as f:
                  ks = json.load(f)
              lambda1 = ks.get("lambda1", None)
              holonomy = ks.get("holonomy_trivial", True)
              h2 = ks.get("dimH2", 0)
              print(f"  λ₁ baseline      : {lambda1}")
              print(f"  Holonomy trivial : {holonomy}")
              print(f"  H² obstructions  : {h2}")

              failures = []
              if lambda1 is not None and lambda1 < 0:
                  failures.append(f"FAIL: λ₁={lambda1} < 0 — coherence regression")
              if not holonomy:
                  failures.append("FAIL: non-trivial holonomy detected")
              if h2 > 0:
                  failures.append(f"WARN: {h2} H² obstruction(s) present")

              if failures:
                  for f in failures:
                      print(f"  {f}")
                  sys.exit(1)
              else:
                  print("  ✓ K(S) baseline within coherence bounds")
          else:
              print("  No K(S) artifact — running structural file checks only.")

          # Structural checks: verify key modules are present
          required = [
              "og-ep-superintendent/core/afe_laplacian.py",
              "og-ep-superintendent/core/ddr_harvester.py",
              "og-ep-superintendent/core/topology_lite.py",
          ]
          missing = [r for r in required if not os.path.exists(r)]
          if missing:
              print(f"  FAIL: missing required files: {missing}")
              sys.exit(1)

          print("  ✓ All required topology modules present")
          print("=== Gate PASSED ===")
          EOF

      - name: Upload final evidence
        uses: actions/upload-artifact@v4
        with:
          name: omega-final-evidence
          path: evidence/
