# ruff.toml — ZuluYokohama Protocol · AAA Studio Grade
# Max lint, targeted ignores for stub/scaffold patterns only

target-version = "py311"
line-length = 120

[lint]
select = [
  "E", "F", "W", "I", "N", "UP", "B", "C4", "SIM",
  "TID", "PIE", "PL", "RUF",
]

ignore = [
  # Unused imports in __init__.py re-export files are intentional
  "F401",   # re-enabled per-file below for strict modules
  # Ambiguous variable name `l` — used intentionally in math (Laplacian `l`)
  "E741",
  # Multiple statements on one line — intentional in compact math expressions
  "E701", "E702",
  # Module-level import not at top — required for conditional path bootstrapping
  "E402",
  # Ruff-specific suggestions that conflict with protocol style
  "RUF012",
]

[lint.per-file-ignores]
# Core math kernel — only F821 (undefined name) and F811 (redefinition) are HALT
"og-ep-superintendent/core/fiber_sheaf_engine.py" = ["F401", "E741"]
"og-ep-superintendent/core/*.py" = ["F401"]
"tui-layer/**/*.py" = ["F401"]
"edge_compute/*.py" = ["F401"]
"distillation/*.py" = ["F401"]
"bipartite_router_plugin/**/*.py" = ["F401"]
"e2e/*.py" = ["F401", "F841"]  # demo/test files — unused vars are instrumentation stubs

# F821 must remain enabled everywhere (undefined names are always HALT)
# F811 must remain enabled everywhere (redefinition is always HALT)
# F841 only silenced in e2e (stubs); HALTs in core/production code

[lint.isort]
known-first-party = ["tui_layer", "bipartite_router_plugin", "edge_compute", "distillation", "og_ep_superintendent"]
